---
name: GreenFloor Rust cache
description: Install the stable Rust toolchain and restore GreenFloor Cargo caches.

inputs:
  save-cache:
    description: Save the Cargo cache at job end (lint+coverage and test jobs populate it).
    required: false
    default: "true"
  shared-key:
    description: >-
      Swatinem/rust-cache shared-key namespace. Use `test` for clippy and plain
      nextest (`target/`). Use `coverage` for llvm-cov (`target-coverage/`). Separate
      target dirs keep instrumented and plain artifacts from poisoning each other.
      Coverage caches must be saved on refs/heads/main; PR-scoped caches are not
      visible to other PRs.
    required: false
    default: "test"
  target-dir:
    description: >-
      Cargo target directory relative to greenfloor-engine (mapped into rust-cache
      workspaces). Use `target` for plain builds and `target-coverage` for llvm-cov.
    required: false
    default: "target"
  install-nextest:
    description: Install cargo-nextest (disable on jobs that only build or lint).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        workspaces: |
          greenfloor-engine -> ${{ inputs.target-dir }}
        cache-workspace-crates: true
        save-if: ${{ inputs.save-cache == 'true' }}

    - uses: taiki-e/install-action@v2
      if: ${{ inputs.install-nextest == 'true' }}
      with:
        tool: nextest
